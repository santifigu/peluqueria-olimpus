{% extends 'base.html' %}
{% block content %}
<h1>Contacto</h1>
<p>{{ negocio.direccion }}</p>
{% if negocio.latitud %}
<iframe width="100%" height="300" style="border:0"
    src="https://www.google.com/maps?q={{ negocio.latitud }},{{ negocio.longitud }}&output=embed"></iframe>
{% endif %}

<form method="post" class="form">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Enviar</button>
</form>
{% endblock %}
